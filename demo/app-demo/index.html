      `<div class="tb-search">${ICON.search}<input type="search" id="mac-search" placeholder="Search" value="${esc(mac.search)}" data-action="mac-search" aria-label="Search" autocomplete="off"></div>` +
      `<button class="tb-btn" data-action="assistant" aria-label="Assistant" title="Assistant">${ICON.ai}</button></div>`;
    $mac.innerHTML = menubar + `<div class="window">${titlebar}<div class="columns"><nav class="sidebar" aria-label="Sections">${sidebar}</nav><div class="list" id="mac-list">${renderMacList()}</div><div class="detail" id="mac-detail">${renderMacDetail()}</div></div></div>` +
      (mac.ctx ? renderContextMenu(mac.ctx) : '') + (ui.sheet ? renderSheet(ui.sheet) : '') + (ui.dialog ? renderDialog(ui.dialog) : '');
    if (toastEl) $mac.appendChild(toastEl);
    if (mac.scrollTo) { mac.scrollTo = false; const on = $mac.querySelector('#mac-list .item.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' }); }
  }
  // Right-click menu on a list row, like Mail.
  function renderContextMenu(ctx) {
    const item = (label, action, extra) => `<button data-action="${action}" ${extra || ''}><span>${label}</span></button>`;
    let html = '';
    if (ctx.kind === 'customer') {
      const c = customerById(ctx.id); if (!c) return '';
      html = item(`New Job for ${esc(c.name)}`, 'new-job-for', `data-id="${c.id}"`) +
        (c.phone ? `<a href="${esc(telURL(c.phone))}" data-action="mac-ctx-close">Call ${esc(c.phone)}</a>` : '') +
        (c.address ? item('Copy Address', 'ctx-copy-address', `data-id="${c.id}"`) + `<a href="${esc(mapsURL(c.address))}" target="_blank" rel="noopener" data-action="mac-ctx-close">Show in Maps</a>` : '') +
        '<hr>' + item('Edit…', 'edit-customer', `data-id="${c.id}"`) + item('Delete…', 'ctx-delete-customer', `data-id="${c.id}"`);
    } else if (ctx.kind === 'quote') {
      const qt = quoteById(ctx.id); if (!qt) return '';
      html = (qt.status === 'open' ? item('Book Job…', 'quote-book', `data-id="${qt.id}"`) + item('Mark Lost', 'quote-lost', `data-id="${qt.id}"`) : item('Reopen', 'quote-reopen', `data-id="${qt.id}"`)) + '<hr>' + item('Delete…', 'quote-delete', `data-id="${qt.id}"`);
    } else if (ctx.kind === 'job') {
      const j = jobById(ctx.id); if (!j) return '';
      html = item(j.done ? 'Mark Not Done' : 'Mark Done', 'ctx-toggle-done', `data-id="${j.id}"`) + (j.price != null ? item(j.paid ? 'Mark Unpaid' : 'Mark Paid', 'ctx-toggle-paid', `data-id="${j.id}"`) : '') + '<hr>' + item('Delete…', 'ctx-delete-job', `data-id="${j.id}"`);
    } else return '';
    return `<div class="menu ctx" style="left:${Math.round(Math.min(ctx.x, 1100 - 270))}px;top:${Math.round(Math.min(ctx.y, 740 - 215))}px" role="menu">${html}</div>`;
  }
  function handleMacAction(action, ds) {
    switch (action) {
      case 'mac-quotes-filter': mac.quotesFilter = ds.filter; ui.draft = null; render(); return true;
      case 'open-quote': mac.section = 'quotes'; mac.sel.quotes = ds.id; { const qt = quoteById(ds.id); if (qt) mac.quotesFilter = qt.status; } mac.search = ''; mac.scrollTo = true; ui.draft = null; render(); return true;
      case 'mac-section': mac.section = ds.section; if (ds.section === 'jobs') mac.jobsFilter = ds.filter || 'upcoming'; mac.menu = null; mac.search = ''; ui.draft = null; render(); return true;
      case 'mac-ctx-close': mac.ctx = null; render(); return true;
      case 'ctx-copy-address': { const c = customerById(ds.id); mac.ctx = null; if (c && navigator.clipboard) navigator.clipboard.writeText(c.address).then(() => toast('Address copied.'), () => toast('Could not copy.')); render(); return true; }
      case 'ctx-delete-customer': { const id = ds.id; mac.ctx = null; confirmDialog('Delete this customer? Their jobs are kept without a customer.', 'Delete', true, () => deleteCustomer(id)); return true; }
      case 'ctx-toggle-done': { const j = jobById(ds.id); mac.ctx = null; ui.draft = null; if (j) { j.done = !j.done; save(); } render(); if (j) toast(j.done ? 'Marked done.' : 'Marked not done.'); return true; }
      case 'ctx-toggle-paid': { const j = jobById(ds.id); mac.ctx = null; ui.draft = null; if (j) { j.paid = !j.paid; save(); } render(); if (j) toast(j.paid ? 'Marked paid.' : 'Marked unpaid.'); return true; }
      case 'ctx-delete-job': { const id = ds.id; mac.ctx = null; confirmDialog('Delete this job?', 'Delete', true, () => { state.jobs = state.jobs.filter(j => j.id !== id); if (mac.sel.jobs === id) mac.sel.jobs = null; save(); }); return true; }
      case 'mac-select': mac.sel[mac.section] = ds.key || ds.id; ui.draft = null; render(); return true;
      case 'mac-menu': mac.menu = mac.menu === ds.menu ? null : ds.menu; render(); return true;
      case 'mac-menu-close': mac.menu = null; render(); return true;
      case 'mac-find': { mac.menu = null; render(); const sIn = document.getElementById('mac-search'); if (sIn) { sIn.focus(); sIn.select(); } return true; }
      case 'mac-import': mac.menu = null; ui.sheet = { type: 'import' }; render(); return true;
      case 'import-run': { const r = runImport(); ui.sheet = null; mac.section = 'customers'; mac.sel.customers = null; mac.search = ''; render(); toast(`${r.added} customers imported.`); return true; }
      case 'mac-settings': mac.menu = null; ui.sheet = { type: 'settings' }; render(); return true;
      case 'open-job': mac.section = 'jobs'; mac.sel.jobs = ds.id; mac.search = ''; mac.scrollTo = true; { const j = jobById(ds.id); mac.jobsFilter = j && j.done ? (isOwed(j) ? 'unpaid' : 'done') : 'upcoming'; } ui.draft = null; render(); return true;
      case 'open-customer': mac.section = 'customers'; mac.sel.customers = ds.id; mac.search = ''; mac.scrollTo = true; ui.draft = null; render(); return true;
      case 'open-dumpster': mac.section = 'dumpsters'; mac.sel.dumpsters = String(ds.id); mac.search = ''; mac.scrollTo = true; ui.draft = null; render(); return true;
      case 'settings': ui.sheet = { type: 'settings' }; render(); return true;
      case 'pop': case 'tab': return true;
      default: return false;
    }
  }
  const $mac = document.getElementById('mac');
  $mac.addEventListener('contextmenu', ev => {
    const row = ev.target.closest('.item[data-action="mac-select"]');
    if (!row || ui.sheet || ui.dialog) return;
    const kind = mac.section === 'customers' ? 'customer' : mac.section === 'jobs' ? 'job' : mac.section === 'quotes' ? 'quote' : mac.section === 'today' && String(row.dataset.key || '').startsWith('job:') ? 'job' : '';
    if (!kind) return;
    ev.preventDefault();
    const r = $mac.getBoundingClientRect(); const sc = r.width / 1100;
    mac.ctx = { kind, id: row.dataset.id, x: (ev.clientX - r.left) / sc, y: (ev.clientY - r.top) / sc }; mac.menu = null; render();
  });
  $mac.addEventListener('click', ev => {
    const btn = ev.target.closest('[data-action], [data-toggle]');
    if (mac.menu || mac.ctx) {
      const toggle = btn && btn.dataset.action === 'mac-menu';
      const inMenu = !!(btn && btn.closest('.menu'));
      if (!toggle) { mac.menu = null; mac.ctx = null; }
      if (!btn) { render(); return; }
      if (btn.tagName === 'A') { setTimeout(render, 0); return; }
      if (!toggle && !inMenu) render();
    }
    if (!btn) return;
    if (btn.dataset.toggle) { handleToggle(btn.dataset.toggle); return; }
    if (!handleMacAction(btn.dataset.action, btn.dataset)) handleAction(btn.dataset.action, btn.dataset);
  });
  $mac.addEventListener('input', ev => {
    const el = ev.target;
    if (el.dataset.action === 'mac-search') { mac.search = el.value; const list = document.getElementById('mac-list'); if (list) list.innerHTML = renderMacList(); return; }
    if (el.dataset.action === 'picker-search' && ui.sheet) { ui.sheet.q = el.value; const pos = el.selectionStart; render(); const again = document.querySelector('[data-action="picker-search"]'); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} } return; }
    if (el.dataset.field && el.type !== 'date' && el.type !== 'time') handleField(el.dataset.field, el.value, el);
  });
  $mac.addEventListener('change', ev => {
    const el = ev.target;
    if (el.dataset.action === 'mac-sort') { mac.sort = el.value; const list = document.getElementById('mac-list'); if (list) list.innerHTML = renderMacList(); return; }
    if (el.dataset.field && (el.tagName === 'SELECT' || el.type === 'date' || el.type === 'time')) handleField(el.dataset.field, el.value, el);
  });
  // A click anywhere outside the Mac window closes its menus. The path is read from the
  // event itself because the window may already have been redrawn by its own handler.
  document.addEventListener('click', ev => { if (mode === 'mac' && (mac.menu || mac.ctx) && !ev.composedPath().includes($mac)) { mac.menu = null; mac.ctx = null; render(); } });
  document.addEventListener('keydown', ev => {
    if (mode !== 'mac') return;
    const cmd = ev.metaKey || ev.ctrlKey; const k = ev.key.toLowerCase();
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
    if (cmd && k === 'f') { ev.preventDefault(); handleMacAction('mac-find', {}); }
    else if (cmd && k === 'n') { ev.preventDefault(); if (!ui.sheet && !ui.dialog) handleAction(ev.shiftKey ? 'new-customer' : 'new-job', {}); }
    else if (cmd && k === 't') { ev.preventDefault(); if (!ui.sheet && !ui.dialog) handleAction('cal-today', {}); }
    else if (cmd && ev.key === ',') { ev.preventDefault(); if (!ui.sheet && !ui.dialog) handleMacAction('mac-settings', {}); }
    else if (cmd && /^[1-5]$/.test(ev.key)) { ev.preventDefault(); if (!ui.sheet && !ui.dialog) handleMacAction('mac-section', { section: MAC_SECTIONS[Number(ev.key) - 1][0] }); }
    else if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && !typing && !ui.sheet && !ui.dialog) {
      const rows = [...document.querySelectorAll('#mac-list .item[data-action="mac-select"]')];
      const i = rows.findIndex(r => r.classList.contains('on'));
      const next = rows[i < 0 ? 0 : i + (ev.key === 'ArrowDown' ? 1 : -1)];
      if (next) { ev.preventDefault(); mac.scrollTo = true; handleMacAction('mac-select', next.dataset); }
    }
    else if (ev.key === 'Escape') { if (mac.ctx || mac.menu) { mac.ctx = null; mac.menu = null; render(); } else if (ui.dialog) { ui.dialog.buttons[0].fn(); } else if (ui.sheet) { handleAction('close-sheet', {}); } }
  });

  // Fit the 1100-point window to the page; a smaller screen gets a scaled-down window.
  function fitMac() {
    const wrap = document.getElementById('mac-wrap'); const el = document.getElementById('mac');
    const avail = Math.max(280, Math.min(1100, (document.querySelector('main').clientWidth || window.innerWidth - 32)));
    const sc = Math.min(1, avail / 1100);
    el.style.transform = `scale(${sc})`; wrap.style.width = `${Math.round(1100 * sc)}px`; wrap.style.height = `${Math.round(740 * sc)}px`;
  }
  window.addEventListener('resize', () => { if (mode === 'mac') fitMac(); });
  function setMode(m) {
    mode = m === 'mac' ? 'mac' : 'phone';
    try { localStorage.setItem(STORE + ':mode', mode); } catch (e) {}
    document.querySelectorAll('.modes button').forEach(b => { b.classList.toggle('on', b.dataset.mode === mode); b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
    document.querySelector('main').classList.toggle('mac-mode', mode === 'mac');
    document.getElementById('phone').hidden = mode === 'mac';
    document.getElementById('mac-wrap').hidden = mode !== 'mac';
    ui.sheet = null; ui.dialog = null; ui.draft = null; ui.stack = []; mac.menu = null; mac.ctx = null;
    if (mode === 'mac') { $nav.innerHTML = ''; $content.innerHTML = ''; $tabbar.innerHTML = ''; $overlay.innerHTML = ''; fitMac(); } else { $mac.innerHTML = ''; }
    render();
  }
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  // Clock in the status bar, like the real thing.
  function tick() { const t = document.getElementById('status-time'); if (t) t.textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/, ''); }
  tick(); setInterval(tick, 30000);

  // The demo opens with the whole customer list already brought in from the
  // spreadsheet, the way the app looks once Ashley has done the import.
  if (firstVisit) { importInto(state); save(); }
  document.getElementById('before-import').addEventListener('click', () => {
    state = seed(); save(); ui.stack = []; ui.sheet = null; ui.draft = null; mac.sel = { today: null, jobs: null, customers: null, dumpsters: null }; mac.search = ''; mac.menu = null; mac.ctx = null; mac.section = 'customers';
    if (mode !== 'mac') setMode('mac'); else render();
    toast('Six customers. File › Import Customers from Excel brings in the rest.');
  });
  setMode(mode);
  // Light the Assistant note up once we know whether Claude is available.
  const waitSample = setInterval(() => { if (sampleReady) { clearInterval(waitSample); if (ui.sheet && ui.sheet.type === 'assistant') render(); } }, 500);
})();
</script>
