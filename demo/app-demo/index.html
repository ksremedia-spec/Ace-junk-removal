<title>Ace Junk Removal App Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a short heading, then the iPhone app itself in a phone-sized frame. */
  :root {

  }

  .mac .menubar button { font: inherit; background: none; border: 0; padding: 0 9px; height: 22px; border-radius: 5px; cursor: default; color: var(--ios-text); }

  // ---------- Dates and money ----------
  const pad = n => String(n).padStart(2, '0');

  const num = n => Number(n || 0).toLocaleString('en-US');

  function seedQuotes() {

  const STORE = 'ace-demo-v1';
  let state;
  function load() { try { const raw = localStorage.getItem(STORE); if (raw) { const s = JSON.parse(raw); if (s && s.jobs && s.dumpsters) return s; } } catch (e) {} return null; }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
  const firstVisit = !load();
  state = load() || seed();
  if (!Array.isArray(state.quotes)) state.quotes = seedQuotes();
  function newId(prefix) { state.nextId = (state.nextId || 100) + 1; return prefix + state.nextId; }
  const customerById = id => state.customers.find(c => c.id === id) || null;
  const jobById = id => state.jobs.find(j => j.id === id) || null;
  const dumpsterById = id => state.dumpsters.find(d => d.id === Number(id)) || null;
  const quoteById = id => (state.quotes || []).find(q => q.id === id) || null;

  function dumpsterStatus(d) {
    if (!d.isOut) return { text: 'In the yard', cls: 'status-green', key: 'inYard' };
    if (!d.dueBack) return { text: 'Out', cls: 'status-grey', key: 'out' };
    const t = todayISO();
    if (d.dueBack === t) return { text: 'Due today', cls: 'status-orange', key: 'dueToday' };
    if (d.dueBack < t) return { text: 'Overdue', cls: 'status-red', key: 'overdue' };
    return { text: 'Out', cls: 'status-grey', key: 'out' };
  }
  function overweightCharge(agreed, actual, rate) { if (agreed == null || actual == null || actual <= agreed) return 0; return Math.round((actual - agreed) * rate * 100) / 100; }
  function jobSortKey(j) { return j.date + 'T' + (j.time || '00:00'); }
  // End times and overlaps (docs/job-length.md). Nothing is assumed: a job with no end is its start moment only.
  const toMin = hhmm => { const [h, m] = String(hhmm || '').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
  const fromMin = n => `${pad(Math.floor(n / 60) % 24)}:${pad(n % 60)}`;
  const isHHMM = v => /^\d{2}:\d{2}$/.test(String(v || ''));
  // "9:00 to 11:00 AM", or "11:00 AM to 1:00 PM" across noon; just "9:00 AM" without an end.
  function timeRange(start, end) {
    if (!start) return '';
    const a = fmtTime(start); if (!end) return a;
    const b = fmtTime(end); const ap = x => (x.match(/[AP]M$/) || [''])[0];
    return ap(a) === ap(b) ? `${a.replace(/\s?[AP]M$/, '')} to ${b}` : `${a} to ${b}`;
  }
  const jobRange = j => timeRange(j.time, j.end);
  const endBeforeStart = (start, end) => !!(start && end && toMin(end) <= toMin(start));
  // Other unfinished jobs that day with a time that clash: spans overlap (touching ends are fine), or a start
  // moment falls inside the other's span, or both start at the same time.
  function overlapsFor(date, time, end, selfId) {
    if (!date || !time) return [];
    const s0 = toMin(time), e0 = end ? toMin(end) : s0;
    return sortedJobs().filter(j => {
      if (j.id === selfId || j.done || j.date !== date || !j.time) return false;

  }
  function overlapText(list) { const j = list[0]; const c = customerById(j.customerId); return `${c ? c.name : 'No customer'}, ${j.type}, ${jobRange(j)}${list.length > 1 ? ` and ${list.length - 1} more` : ''}`; }

  }

  function sortedJobs() { return [...state.jobs].sort((a, b) => jobSortKey(a).localeCompare(jobSortKey(b))); }

  // ---------- Business figures from the records ----------

    const m = new Map();

  function dayGroups(jobs) { const groups = []; for (const j of jobs) { const g = groups[groups.length - 1]; if (g && g.date === j.date) g.jobs.push(j); else groups.push({ date: j.date, jobs: [j] }); } return groups; }
  function dayHeader(g) { const total = g.jobs.reduce((n, j) => n + (j.price || 0), 0); return `${fmtDay(g.date)} · ${g.jobs.length} ${g.jobs.length === 1 ? 'job' : 'jobs'}${total ? ' · ' + money(total) : ''}`; }
  function monthRentals(d) { const m = todayISO().slice(0, 7); const rows = d.history.filter(h => (h.pickedUp || '').slice(0, 7) === m); return { n: rows.length, sum: rows.reduce((n, h) => n + (h.price || 0) + (h.charge || 0), 0) }; }
  function deleteCustomer(id) {

  // Which device is showing. The Mac has its own selection and search; sheets and dialogs are shared.
  let mode = 'phone';
  try { if (localStorage.getItem(STORE + ':mode') === 'mac') mode = 'mac'; } catch (e) {}
  const mac = { section: 'customers', sel: { today: null, jobs: null, quotes: null, customers: null, dumpsters: null }, search: '', menu: null, jobsFilter: 'upcoming', quotesFilter: 'open', sort: 'name', ctx: null };

  const $nav = document.getElementById('nav');
  const $content = document.getElementById('content');
  const $tabbar = document.getElementById('tabbar');
  const $overlay = document.getElementById('overlay');

  function render() {
    if (mode === 'mac') { renderMac(); return; }
    const top = ui.stack[ui.stack.length - 1];
    let screen;
    if (top) screen = renderPushed(top);
    else screen = renderTab(ui.tab);
    $nav.innerHTML = screen.nav;
    $content.innerHTML = screen.body;
    $tabbar.innerHTML = renderTabBar();
    $tabbar.style.display = top && top.type !== 'settings' ? 'none' : 'flex';
    $overlay.innerHTML = (ui.sheet ? renderSheet(ui.sheet) : '') + (ui.dialog ? renderDialog(ui.dialog) : '');
    try { localStorage.setItem(STORE + ':tab', ui.tab); } catch (e) {}
  }

  function navBar(opts) {
    const left = opts.left || '';
    const right = opts.right || '';
    const title = opts.title ? `<div class="title ${opts.small ? 'small' : ''}">${esc(opts.title)}</div>` : '';
    return `<div class="bar"><div class="left">${left}</div><div class="right">${right}</div></div>${title}`;
  }
  const backBtn = () => `<button class="circle" data-action="pop" aria-label="Back">${ICON.back}</button>`;
  const assistantBtn = () => `<button class="circle" data-action="assistant" aria-label="Assistant" title="Assistant">${ICON.ai}</button>`;
  const assistantPlusGroup = (plusAction, plusLabel) => `<span class="pill" style="padding:0 6px;gap:2px"><button class="circle" style="box-shadow:none;border:0;background:none" data-action="assistant" aria-label="Assistant">${ICON.ai}</button><button class="circle" style="box-shadow:none;border:0;background:none" data-action="${plusAction}" aria-label="${plusLabel}">${ICON.plus}</button></span>`;

  function renderTabBar() {
    const tabs = [['today', 'Calendar', ICON.calendar], ['jobs', 'Jobs', ICON.list], ['quotes', 'Quotes', ICON.doc], ['customers', 'Customers', ICON.people], ['dumpsters', 'Dumpsters', ICON.box]];
    return tabs.map(([k, label, icon]) => `<button class="tab ${ui.tab === k ? 'on' : ''}" data-action="tab" data-tab="${k}">${icon}<span>${label}</span></button>`).join('');
  }

  // ---------- Rows ----------
  function jobRow(j, showDate, inCustomer) {
    const c = customerById(j.customerId);
    const when = showDate ? `${fmtDay(j.date)}${j.time ? ', ' + jobRange(j) : ''}` : (j.time ? jobRange(j) : '');
    if (inCustomer) {
      const marks2 = [j.done ? 'Done' : null, j.paid ? 'Paid' : (isOwed(j) ? '<span class="status-orange">Unpaid</span>' : null)].filter(Boolean).join(' · ');
      return `<button class="row tap" data-action="open-job" data-id="${j.id}"><div class="main"><div class="headline"><span class="${j.done ? 'strike' : ''}">${esc(j.type)}</span>${j.price != null ? `<span class="amount ${j.paid ? 'paid' : ''}">${money(j.price)}</span>` : ''}</div><div class="sub">${when}${j.notes ? ' · ' + esc(j.notes) : ''}</div>${marks2 ? `<div class="sub small">${marks2}</div>` : ''}</div><span class="chev">›</span></button>`;
    }
    const marks = [j.done ? 'Done' : null, j.paid ? 'Paid' : (isOwed(j) ? '<span class="status-orange">Unpaid</span>' : null)].filter(Boolean).join(' · ');
    return `<button class="row tap" data-action="open-job" data-id="${j.id}">
      <div class="main">
        <div class="headline"><span class="${j.done ? 'strike' : ''}">${esc(c ? c.name : 'No customer')}</span>${j.price != null ? `<span class="amount ${j.paid ? 'paid' : ''}">${money(j.price)}</span>` : ''}</div>
        <div class="sub">${esc(j.type)}${when ? ' · ' + when : ''}</div>
        ${c && c.address ? `<div class="sub small">${esc(c.address)}</div>` : ''}
        ${marks ? `<div class="sub small">${marks}</div>` : ''}
      </div><span class="chev">›</span></button>`;
  }
  function dumpsterRow(d) {
    const s = dumpsterStatus(d);
    const c = customerById(d.customerId);
    const name = d.label ? `Dumpster ${d.id} · ${d.label}` : `Dumpster ${d.id}`;
    return `<button class="row tap" data-action="open-dumpster" data-id="${d.id}">
      <div class="main">
        <div class="headline"><span>${esc(name)}</span><span class="${s.cls}" style="font-weight:400;font-size:15px">${s.text}</span></div>
        ${d.isOut && c ? `<div class="sub" style="color:var(--ios-text)">${esc(c.name)}</div>` : ''}
        ${d.isOut && d.location ? `<div class="sub small">${esc(d.location)}</div>` : ''}
        ${d.isOut && d.dueBack ? `<div class="sub small ${s.key === 'out' ? '' : s.cls}">Due back ${fmtDay(d.dueBack)}</div>` : ''}
        ${d.condition ? `<div class="sub small status-orange">${esc(d.condition)}</div>` : ''}
      </div><span class="chev">›</span></button>`;
  }
  function section(title, inner, footer) {
    return `<div class="section">${title ? `<h3>${esc(title)}</h3>` : ''}<div class="card">${inner}</div>${footer ? `<div class="footer">${esc(footer)}</div>` : ''}</div>`;
  }
  const emptyRow = text => `<div class="row"><span class="empty">${esc(text)}</span></div>`;

  // ---------- Tabs ----------
  function renderTab(tab) {
    if (tab === 'today') return renderToday();
    if (tab === 'jobs') return renderJobs();
    if (tab === 'quotes') return renderQuotes();
    if (tab === 'customers') return renderCustomers();
    return renderDumpsters();
  }

  // ---------- Calendar (docs/calendar-tab.md) ----------
  // The calendars on a set-up phone, for the demo: Google's "Ace Jobs" (where jobs are written), Alex's own
  // Google calendar, a home iCloud calendar and Google's holidays. Their events are made up and move with today.
  const DEVICE_CALS = [
    { id: 'ace', name: 'Ace Jobs', account: 'Google', color: '#33b679', writable: true },
    { id: 'alex', name: 'Alex', account: 'Google', color: '#039be5', writable: true },
    { id: 'home', name: 'Home', account: 'iCloud', color: '#ff9500', writable: true },
    { id: 'holidays', name: 'Holidays in United States', account: 'Google', color: '#8e24aa', writable: false },
  ];
  const calById = id => DEVICE_CALS.find(c => c.id === id) || null;
  function calSettings() { if (!state.settings) state.settings = {}; if (!state.settings.cal) state.settings.cal = { jobs: 'ace', hidden: [] }; return state.settings.cal; }
  function otherEvents() {
    const ev = (id, cal, day, title, time, end, location, notes) => ({ id, cal, date: offsetISO(day), title, time, end, location: location || '', notes: notes || '' });
    const list = [
      ev('e1', 'alex', 0, 'Truck 2 inspection', '07:00', '07:45'),
      ev('e2', 'alex', -2, 'Insurance renewal call', '10:00', '10:30'),
      ev('e3', 'home', 1, 'Dentist', '15:00', '16:00'),
      ev('e4', 'alex', 3, 'New tires for Truck 4', '12:00', '13:00', '', 'Drop the truck off in the morning.'),
      ev('e5', 'home', 6, 'Soccer game', '09:00', '11:00'),
    ];
    const y = new Date().getFullYear();
    for (const yy of [y - 1, y, y + 1]) {
      for (const [md, title] of [['01-01', "New Year's Day"], ['07-04', 'Independence Day'], ['10-31', 'Halloween'], ['11-11', 'Veterans Day'], ['12-25', 'Christmas Day']]) list.push({ id: `h${yy}${md}`, cal: 'holidays', date: `${yy}-${md}`, title, time: '', end: '', location: '', notes: '' });
      const nov1 = new Date(yy, 10, 1).getDay(); const thu = 1 + ((4 - nov1 + 7) % 7) + 21;
      list.push({ id: `h${yy}thanks`, cal: 'holidays', date: `${yy}-11-${pad(thu)}`, title: 'Thanksgiving Day', time: '', end: '', location: '', notes: '' });
    }
    return list;
  }
  const eventById = id => otherEvents().find(e => e.id === id) || null;
  // The other calendars' events on a day, all-day ones first. Copies of jobs in the jobs calendar would be left out
  // here (the job is listed already); the demo's made-up events have none.
  function eventsOn(iso) {
    const hidden = calSettings().hidden || [];
    return otherEvents().filter(e => e.date === iso && !hidden.includes(e.cal)).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  }
  const eventLine = e => `${e.time ? timeRange(e.time, e.end) : 'All day'} · ${esc((calById(e.cal) || {}).name || '')}`;
  function eventRow(e) {
    const c = calById(e.cal) || {};
    return `<button class="row tap" data-action="open-event" data-id="${e.id}"><span class="cal-dot" style="background:${c.color}"></span><div class="main"><div>${esc(e.title)}</div><div class="sub">${eventLine(e)}</div></div><span class="chev">›</span></button>`;
  }
  // Dumpsters going out, due back or picked up on a day: current rentals and finished ones.
  function dumpsterEventsOn(iso) {
    const out = [];
    for (const d of state.dumpsters) {
      if (d.isOut && d.droppedOff === iso) out.push({ d, what: 'drop-off', customerId: d.customerId, location: d.location });
      if (d.isOut && d.dueBack === iso) out.push({ d, what: 'due back', customerId: d.customerId, location: d.location });
      for (const h of d.history) {
        if (h.droppedOff === iso) out.push({ d, what: 'drop-off', customerId: h.customerId, location: h.location });
        if (h.pickedUp === iso) out.push({ d, what: 'picked up', customerId: h.customerId, location: h.location });
      }
    }
    return out;
  }
  const dumpsterEventLine = x => { const c = customerById(x.customerId); return [c ? c.name : '', x.location].filter(Boolean).map(esc).join(' · '); };
  function dumpsterEventRow(x) {
    const line = dumpsterEventLine(x);
    return `<button class="row tap" data-action="open-dumpster" data-id="${x.d.id}"><div class="main"><div class="headline"><span>Dumpster ${x.d.id} ${x.what}</span></div>${line ? `<div class="sub">${line}</div>` : ''}</div><span class="chev">›</span></button>`;
  }
  // Quotes to call back: on today, every open one due today or earlier; on another day, those set for that day.
  function callbacksOn(iso) {
    const open = (state.quotes || []).filter(q => q.status === 'open' && q.followUp);
    return (iso === todayISO() ? open.filter(quoteDue) : open.filter(q => q.followUp === iso)).sort((a, b) => a.followUp.localeCompare(b.followUp));
  }
  // The month: Apple's iPhone month view (dots under days with a job not done), or the Mac's month picker (no dots).
  function monthGrid(macStyle) {
    const t = todayISO(), sel = ui.calDay || t;
    const ym = ui.calMonth || sel.slice(0, 7);
    const [y, m] = ym.split('-').map(Number);
    const first = new Date(y, m - 1, 1), daysIn = new Date(y, m, 0).getDate();
    const busy = macStyle ? new Set() : new Set(state.jobs.filter(j => !j.done).map(j => j.date));
    let cells = '';
    for (let i = 0; i < first.getDay(); i++) cells += '<span></span>';
    for (let d = 1; d <= daysIn; d++) {
      const iso = `${y}-${pad(m)}-${pad(d)}`;
      cells += `<button class="${iso === t ? 'today' : ''} ${iso === sel ? 'sel' : ''}" data-action="cal-day" data-date="${iso}" aria-label="${fmtLongDay(iso)}${busy.has(iso) ? ', jobs' : ''}" aria-pressed="${iso === sel}"><span class="n">${d}</span>${busy.has(iso) ? '<span class="dot"></span>' : ''}</button>`;
    }
    const wk = (macStyle ? ['S', 'M', 'T', 'W', 'T', 'F', 'S'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']).map(w => `<span>${w}</span>`).join('');
    return `<div class="month ${macStyle ? 'compact' : ''}"><div class="mhead"><span class="mtitle">${first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span><span class="marrows"><button data-action="cal-month" data-step="-1" aria-label="Previous month">${ICON.back}</button><button data-action="cal-month" data-step="1" aria-label="Next month">${ICON.forward}</button></span></div><div class="wk">${wk}</div><div class="days">${cells}</div></div>`;
  }
  const newJobRow = (action, date) => `<button class="row tap link-row" data-action="${action}"${date ? ` data-date="${date}"` : ''}>${ICON.plus.replace('<svg', '<svg style="width:20px;height:20px"')} New job</button>`;

  function renderToday() {
    const t = todayISO(), tomorrow = offsetISO(1), day = ui.calDay || t;
    const dayJobs = sortedJobs().filter(j => j.date === day);
    const events = eventsOn(day), calls = callbacksOn(day);
    let body = section('', monthGrid(false));
    if (day === t) {
      const attention = state.dumpsters.filter(d => ['dueToday', 'overdue'].includes(dumpsterStatus(d).key));
      const todays = dayJobs.filter(j => !j.done);
      const slipped = sortedJobs().filter(j => j.date < t && !j.done);
      const tomorrows = sortedJobs().filter(j => j.date === tomorrow && !j.done);
      const expected = todays.reduce((n, j) => n + (j.price || 0), 0); const owed = owedTotal();
      body += section('',
        `<div class="field"><label>Jobs today</label><span class="value filled">${todays.length}${expected ? ' · ' + money(expected) : ''}</span></div>` +
        `<div class="field"><label>Dumpsters due back</label><span class="value filled ${attention.length ? 'status-orange' : ''}">${attention.length}</span></div>` +
        (owed.sum ? `<div class="field"><label>Owed</label><span class="value filled status-orange">${money(owed.sum)} from ${owed.n} ${owed.n === 1 ? 'job' : 'jobs'}</span></div>` : '') +
        quotesTodayRow());
      body += section('Dumpsters', attention.length ? attention.map(dumpsterRow).join('') : emptyRow(state.dumpsters.length ? 'Nothing due back today.' : 'No dumpsters set up yet.'));
      body += section(fmtLongDay(t), (dayJobs.length ? dayJobs.map(j => jobRow(j, false)).join('') : emptyRow('No jobs today.')) + newJobRow('new-job'));
      if (slipped.length) body += section('Not marked done', slipped.map(j => jobRow(j, true)).join(''));
      if (calls.length) body += section('Call back', calls.map(quoteRow).join(''));
      if (events.length) body += section('Other calendars', events.map(eventRow).join(''));
      body += section('Tomorrow', tomorrows.length ? tomorrows.map(j => jobRow(j, false)).join('') : emptyRow('No jobs tomorrow.'));
    } else {
      const dumps = dumpsterEventsOn(day);
      body += section(fmtLongDay(day), (dayJobs.length ? dayJobs.map(j => jobRow(j, false)).join('') : emptyRow('No jobs.')) + newJobRow('new-job-on', day));
      if (dumps.length) body += section('Dumpsters', dumps.map(dumpsterEventRow).join(''));
      if (calls.length) body += section('Call back', calls.map(quoteRow).join(''));
      if (events.length) body += section('Other calendars', events.map(eventRow).join(''));
    }
    const left = `<button class="circle" data-action="settings" aria-label="Settings">${ICON.gear}</button>` + (day === t ? '' : `<button class="pill" data-action="cal-today" style="margin-left:8px">Today</button>`);
    return { nav: navBar({ title: 'Calendar', left, right: assistantBtn() }), body };
  }

  // An other calendar's event, read-only (the app opens Apple's own event screen here).
  function eventDetailBody(e) {
    const c = calById(e.cal) || {};
    return section('', `<div class="row"><div class="main"><div class="headline" style="font-size:20px">${esc(e.title)}</div>${e.location ? `<div class="sub">${esc(e.location)}</div>` : ''}<div class="sub" style="margin-top:6px">${fmtLongDay(e.date)}</div><div class="sub">${e.time ? 'from ' + fmtTime(e.time) + (e.end ? ' to ' + fmtTime(e.end) : '') : 'All day'}</div></div></div>`) +
      section('', `<div class="field"><label>Calendar</label><span class="value filled"><span class="cal-dot" style="background:${c.color};margin-right:6px;vertical-align:-1px"></span>${esc(c.name || '')}</span></div>`) +
      (e.notes ? section('Notes', `<div class="row"><div class="main"><div>${esc(e.notes)}</div></div></div>`) : '');
  }
  function renderEventDetail(item) {
    const e = eventById(item.id);
    return { nav: navBar({ title: 'Event Details', small: true, left: backBtn() }), body: e ? eventDetailBody(e) : '' };
  }

  // "Quotes to follow up" on Today (docs/quotes.md): open quotes whose call-back day is today or earlier.
  function quotesToFollowUp() { return (state.quotes || []).filter(quoteDue).length; }
  function quotesTodayRow() {
    if (!(state.quotes || []).some(q => q.status === 'open')) return '';
    const n = quotesToFollowUp();
    return `<button class="row tap" data-action="today-quotes"><div class="main"><div>Quotes to follow up</div></div><span class="${n ? 'status-orange' : 'status-grey'}" style="margin-right:6px">${n}</span><span class="chev">›</span></button>`;
  }

  function renderJobs() {
    const q = ui.search.trim().toLowerCase(); const qd = digits(q);
    const all = sortedJobs().filter(j => {
      if (!q) return true;
      const c = customerById(j.customerId) || {};
      return (c.name || '').toLowerCase().includes(q) || (c.address || '').toLowerCase().includes(q) || (qd && digits(c.phone).includes(qd)) || j.notes.toLowerCase().includes(q) || j.type.toLowerCase().includes(q);
    });
    const t = todayISO(); const filter = ui.jobsFilter || 'upcoming';
    let body = `<div class="search">${ICON.search}<input type="search" id="search" placeholder="Customer, address or notes" value="${esc(ui.search)}" data-action="search"></div>`;
    body += `<div class="segments">${[['upcoming', 'Upcoming'], ['unpaid', 'Unpaid'], ['done', 'Done']].map(([k, l]) => `<button class="${filter === k ? 'on' : ''}" data-action="jobs-filter" data-filter="${k}">${l}</button>`).join('')}</div>`;
    if (filter === 'upcoming') {
      const overdue = all.filter(j => !j.done && j.date < t);
      const upcoming = all.filter(j => !j.done && j.date >= t);
      if (overdue.length) body += section('Not marked done', overdue.map(j => jobRow(j, true)).join(''));
      if (upcoming.length) for (const g of dayGroups(upcoming)) body += section(dayHeader(g), g.jobs.map(j => jobRow(j, false)).join(''));
      else body += section('Upcoming', emptyRow(q ? 'No matching jobs.' : 'No jobs scheduled.'));
    } else if (filter === 'unpaid') {
      const owed = all.filter(isOwed).reverse(); const sum = owed.reduce((n, j) => n + j.price, 0);
      body += section(owed.length ? `Owed · ${money(sum)}` : 'Owed', owed.length ? owed.map(j => jobRow(j, true)).join('') : emptyRow(q ? 'No matching jobs.' : 'Nothing owed.'));
    } else {
      const done = all.filter(j => j.done).reverse();
      body += section(done.length ? `Done · ${done.length}` : 'Done', done.length ? done.slice(0, 200).map(j => jobRow(j, true)).join('') + (done.length > 200 ? emptyRow(`${done.length - 200} more. Search to narrow the list.`) : '') : emptyRow(q ? 'No matching jobs.' : 'No done jobs.'));
    }
    return { nav: navBar({ title: 'Jobs', right: assistantPlusGroup('new-job', 'New job') }), body };
  }

  // ---------- Quotes (docs/quotes.md) ----------
  const quoteDue = q => q.status === 'open' && q.followUp && q.followUp <= todayISO();
  function quoteMatches(q, text) {
    const t = String(text || '').trim().toLowerCase(); if (!t) return true; const td = digits(t);
    const c = customerById(q.customerId) || {};
    return [c.name, c.address, q.details, q.type, q.notes].some(v => v && String(v).toLowerCase().includes(t)) || (td.length >= 3 && digits(c.phone).includes(td));
  }
  function quoteLists(text) {
    const all = (state.quotes || []).filter(q => quoteMatches(q, text));
    const open = all.filter(q => q.status === 'open');
    return {
      due: open.filter(quoteDue).sort((a, b) => a.followUp.localeCompare(b.followUp)),
      waiting: open.filter(q => !quoteDue(q)).sort((a, b) => a.quotedOn.localeCompare(b.quotedOn)),
      booked: all.filter(q => q.status === 'booked').sort((a, b) => b.quotedOn.localeCompare(a.quotedOn)),
      lost: all.filter(q => q.status === 'lost').sort((a, b) => b.quotedOn.localeCompare(a.quotedOn)),
      open,
    };
  }
  const quoteTotal = list => list.reduce((n, q) => n + (q.price || 0), 0);
  function quoteWhen(q) {
    if (q.status === 'booked') { const j = jobById(q.jobId); return j ? `Booked · ${fmtDay(j.date)}${j.time ? ' at ' + fmtTime(j.time) : ''}` : 'Booked'; }
    if (q.status === 'lost') return `Lost · quoted ${fmtDay(q.quotedOn)}`;
    let follow = '';
    if (q.followUp) {
      const t = todayISO();
      follow = q.followUp === t ? ' · <span class="status-orange">Follow up today</span>' : q.followUp < t ? ` · <span class="status-orange">Follow up was ${fmtDay(q.followUp)}</span>` : ` · Follow up ${fmtDay(q.followUp)}`;
    }
    return `Quoted ${fmtDay(q.quotedOn)}${follow}`;
  }
  function quoteRow(q) {
    const c = customerById(q.customerId);
    return `<button class="row tap" data-action="open-quote" data-id="${q.id}">
      <div class="main">
        <div class="headline"><span>${esc(c ? c.name : 'No customer')}</span><span class="amount">${q.price != null ? money(q.price) : 'No price'}</span></div>
        <div class="sub">${esc(q.type)}${q.details ? ' · ' + esc(q.details) : ''}</div>
        <div class="sub small">${quoteWhen(q)}</div>
      </div><span class="chev">›</span></button>`;
  }
  function renderQuotes() {
    const filter = ui.quotesFilter || 'open';
    const L = quoteLists(ui.search); const q = ui.search.trim();
    let body = `<div class="search">${ICON.search}<input type="search" id="search" placeholder="Name, address or what was quoted" value="${esc(ui.search)}" data-action="search"></div>`;
    body += `<div class="segments">${[['open', 'Open'], ['booked', 'Booked'], ['lost', 'Lost']].map(([k, l]) => `<button class="${filter === k ? 'on' : ''}" data-action="quotes-filter" data-filter="${k}">${l}</button>`).join('')}</div>`;
    if (filter === 'open') {
      const total = quoteTotal(L.open);
      body += `<div class="steps-line" style="margin:0 18px 4px">${L.open.length} open${total ? ' · ' + money(total) : ''}</div>`;
      if (L.due.length) body += section('Follow up', L.due.map(quoteRow).join(''));
      body += section('Waiting', L.waiting.length ? L.waiting.map(quoteRow).join('') : emptyRow(q ? 'No matching quotes.' : (L.due.length ? 'Nothing else waiting.' : 'No open quotes.')));
    } else {
      const list = filter === 'booked' ? L.booked : L.lost;
      body += section(filter === 'booked' ? 'Booked' : 'Lost', list.length ? list.map(quoteRow).join('') : emptyRow(q ? 'No matching quotes.' : (filter === 'booked' ? 'No booked quotes.' : 'No lost quotes.')));
    }
    return { nav: navBar({ title: 'Quotes', right: assistantPlusGroup('new-quote', 'New quote') }), body };
  }
  function quoteDraftFrom(q) {
    return q ? { customerId: q.customerId, type: q.type, details: q.details, price: q.price == null ? '' : String(q.price), quotedOn: q.quotedOn, hasFollowUp: !!q.followUp, followUp: q.followUp || offsetISO(3), notes: q.notes }
             : { customerId: null, type: 'Junk removal', details: '', price: '', quotedOn: todayISO(), hasFollowUp: true, followUp: offsetISO(3), notes: '' };
  }
  function applyQuoteDraft(q, d) {
    q.customerId = d.customerId; q.type = d.type; q.details = (d.details || '').trim(); q.price = parseMoney(d.price);
    q.quotedOn = d.quotedOn || todayISO(); q.followUp = d.hasFollowUp ? (d.followUp || offsetISO(3)) : ''; q.notes = (d.notes || '').trim();
  }
  function quoteForm(draft) {
    const c = customerById(draft.customerId);
    let html = section('Customer',
      `<div class="field"><label>Customer</label><button type="button" class="pill blue" style="min-height:36px;padding:0 12px" data-action="pick-customer">${esc(c ? c.name : 'Choose')}</button></div>` +
      (c && c.phone ? `<div class="field"><label>Phone</label><span class="value filled">${esc(c.phone)}</span></div>` : '') +
      (c && c.address ? `<div class="field"><label>Address</label><span class="value filled" style="max-width:60%">${esc(c.address)}</span></div>` : ''));
    html += section('Quote',
      fieldSelect('Type', 'type', draft.type, JOB_TYPES) +
      fieldText('What', 'details', draft.details, 'What was quoted') +
      fieldText('Price', 'price', draft.price, 'Price in dollars') +
      fieldText('Quoted', 'quotedOn', draft.quotedOn, '', 'date'));
    html += section('', fieldToggle('Follow up', 'hasFollowUp', draft.hasFollowUp) + (draft.hasFollowUp ? fieldText('Call back on', 'followUp', draft.followUp, '', 'date') : ''));
    html += section('Notes', fieldNotes('notes', draft.notes));
    return html;
  }
  function quoteActions(q) {
    let rows = '';
    if (q.status === 'open') rows = `<button class="row tap link-row" data-action="quote-book" data-id="${q.id}">Book Job</button><button class="row tap link-row" data-action="quote-lost" data-id="${q.id}">Mark Lost</button>`;
    else {
      const j = q.status === 'booked' ? jobById(q.jobId) : null;
      if (j) rows += `<button class="row tap" data-action="open-job" data-id="${j.id}"><div class="main"><div>Job</div><div class="sub small">${esc(j.type)} · ${fmtDay(j.date)}${j.time ? ' at ' + fmtTime(j.time) : ''}</div></div><span class="chev">›</span></button>`;
      rows += `<button class="row tap link-row" data-action="quote-reopen" data-id="${q.id}">Reopen</button>`;
    }
    return section(q.status === 'open' ? '' : (q.status === 'booked' ? 'Booked' : 'Lost'), rows) + section('', `<button class="row tap link-row destructive" data-action="quote-delete" data-id="${q.id}">Delete Quote</button>`);
  }
  function renderQuoteDetail(item) {
    const qt = quoteById(item.id);
    if (!qt) return { nav: navBar({ title: 'Quote', small: true, left: backBtn() }), body: section('', emptyRow('This quote was deleted.')) };
    if (!ui.draft || ui.draft.kind !== 'quote' || ui.draft.id !== item.id) ui.draft = { kind: 'quote', id: item.id, data: quoteDraftFrom(qt) };
    const d = ui.draft.data;
    return { nav: navBar({ title: 'Quote', small: true, left: backBtn(), right: `<button class="pill bold" data-action="save-quote" ${d.customerId ? '' : 'disabled style="opacity:.4"'}>Save</button>` }), body: quoteForm(d) + quoteActions(qt) };
  }

  function renderCustomers() {
    const q = ui.search.trim().toLowerCase(); const qd = digits(q);
    const list = [...state.customers].sort((a, b) => a.name.localeCompare(b.name)).filter(c => !q || c.name.toLowerCase().includes(q) || c.address.toLowerCase().includes(q) || (qd && digits(c.phone).includes(qd)));
    const stats = customerStats();
    const rows = list.length ? list.map(c => `<button class="row tap" data-action="open-customer" data-id="${c.id}"><div class="main"><div>${esc(c.name)}</div>${(c.phone || c.address) ? `<div class="sub small">${esc([c.phone, c.address].filter(Boolean).join(' · '))}</div>` : ''}<div class="sub small">${esc(statsLine(stats.get(c.id)))}</div></div><span class="chev">›</span></button>`).join('') : emptyRow(state.customers.length ? 'No matches.' : 'No customers yet.');
    const body = `<div class="search">${ICON.search}<input type="search" id="search" placeholder="Name, phone or address" value="${esc(ui.search)}" data-action="search"></div>` + section('', rows);
    return { nav: navBar({ title: 'Customers', right: assistantPlusGroup('new-customer', 'New customer') }), body };
  }

  function renderDumpsters() {
    const out = state.dumpsters.filter(d => d.isOut).length;
    const body = section(`${out} out · ${state.dumpsters.length - out} in the yard`, state.dumpsters.map(dumpsterRow).join(''));
    return { nav: navBar({ title: 'Dumpsters', right: assistantBtn() }), body };
  }

  // ---------- Pushed screens ----------
  function renderPushed(item) {
    if (item.type === 'job') return renderJobDetail(item);
    if (item.type === 'quote') return renderQuoteDetail(item);
    if (item.type === 'customer') return renderCustomerDetail(item);
    if (item.type === 'dumpster') return renderDumpsterDetail(item);
    if (item.type === 'settings') return renderSettings();
    if (item.type === 'event') return renderEventDetail(item);
    return { nav: navBar({ title: '' }), body: '' };
  }

  function fieldText(label, name, value, placeholder, type) {
    return `<div class="field"><label for="f-${name}">${esc(label)}</label><input id="f-${name}" type="${type || 'text'}" data-field="${name}" value="${esc(value ?? '')}" placeholder="${esc(placeholder || '')}"></div>`;
  }
  function fieldSelect(label, name, value, options) {
    return `<div class="field"><label for="f-${name}">${esc(label)}</label><select id="f-${name}" data-field="${name}">${options.map(o => `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
  }
  function fieldToggle(label, name, on) {
    return `<div class="field"><label>${esc(label)}</label><button type="button" class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-toggle="${name}"></button></div>`;
  }
  function fieldNotes(name, value) {
    return `<div class="field stack"><textarea data-field="${name}" placeholder="Notes" aria-label="Notes">${esc(value ?? '')}</textarea></div>`;
  }

  function jobDraftFrom(j) {
    return j ? { customerId: j.customerId, type: j.type, date: j.date, time: j.time, hasTime: !!j.time, hasEnd: !!(j.time && j.end), end: j.end || '', price: j.price == null ? '' : String(j.price), payment: j.payment, paid: j.paid, done: j.done, notes: j.notes }
             : { customerId: null, type: 'Junk removal', date: todayISO(), time: nextHour(), hasTime: true, hasEnd: false, end: '', price: '', payment: 'Not set', paid: false, done: false, notes: '' };
  }
  function nextHour() { const d = new Date(); d.setHours(d.getHours() + 1, 0, 0, 0); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

  function jobForm(draft, isNew, selfId) {
    const c = customerById(draft.customerId);
    let html = section('Customer',
      `<div class="field"><label>Customer</label><button type="button" class="pill blue" style="min-height:36px;padding:0 12px" data-action="pick-customer">${esc(c ? c.name : 'Choose')}</button></div>` +
      (c && c.phone ? `<div class="field"><label>Phone</label><span class="value filled">${esc(c.phone)}</span></div>` : '') +
      (c && c.address ? `<div class="field"><label>Address</label><span class="value filled" style="max-width:60%">${esc(c.address)}</span></div>` : ''));
    html += section('Job',
      fieldSelect('Type', 'type', draft.type, JOB_TYPES) +
      fieldText('Date', 'date', draft.date, '', 'date') +
      fieldToggle('Set a time', 'hasTime', draft.hasTime) +
      (draft.hasTime ? fieldText('Time', 'time', draft.time, '', 'time') + endFields('', draft.hasEnd, draft.end, draft.time) + overlapNote(overlapsFor(draft.date, draft.time, draft.hasEnd ? draft.end : '', selfId || null)) : ''));
    html += section('Payment',
      fieldText('Price', 'price', draft.price, 'Price in dollars', 'text') +
      fieldSelect('Payment', 'payment', draft.payment, ['Cash', 'Check', 'Card', 'Not set']) +
      fieldToggle('Paid', 'paid', draft.paid));
    html += section('Notes', fieldNotes('notes', draft.notes));
    if (!isNew) {
      html += section('', fieldToggle('Done', 'done', draft.done));
      html += section('', `<button class="row tap link-row destructive" data-action="delete-job">Delete job</button>`);
    }
    return html;
  }

  function renderJobDetail(item) {
    if (!ui.draft || ui.draft.kind !== 'job' || ui.draft.id !== item.id) ui.draft = { kind: 'job', id: item.id, data: jobDraftFrom(jobById(item.id)) };
    const d = ui.draft.data;
    return { nav: navBar({ title: 'Job', small: true, left: backBtn(), right: `<button class="pill bold" data-action="save-job" ${d.customerId ? '' : 'disabled style="opacity:.4"'}>Save</button>` }), body: jobForm(d, false, item.id) };
  }

  function customerSummaryRows(c) {
    const st = customerStats().get(c.id);
    if (!st) return `<div class="field"><label>Customer since</label><span class="value filled">New customer</span></div>`;
    return `<div class="field"><label>Customer since</label><span class="value filled">${fmtMonthYear(st.first)}</span></div>` +
      `<div class="field"><label>Jobs</label><span class="value filled">${st.jobs}${st.total ? ' · ' + money(st.total) : ''}</span></div>` +
      (st.owed > 0 ? `<div class="field"><label class="status-orange">Owed</label><span class="value filled status-orange">${money(st.owed)}</span></div>` : '');
  }
  function customerActions(c) {
    const a = [];
    if (c.phone) { a.push(`<a class="pill blue" href="${esc(telURL(c.phone))}">Call</a>`); a.push(`<a class="pill blue" href="${esc(smsURL(c.phone))}">Message</a>`); }
    if (c.address) a.push(`<a class="pill blue" href="${esc(mapsURL(c.address))}" target="_blank" rel="noopener">Directions</a>`);
    return a.length ? `<div class="actions-row">${a.join('')}</div>` : '';
  }
  function customerRentals(c) {
    const rows = [];
    for (const d of state.dumpsters) {
      if (d.isOut && d.customerId === c.id) rows.push({ n: d.id, from: d.droppedOff, to: '', due: d.dueBack, agreed: d.agreedTons, actual: null, charge: 0, price: d.price, current: true });
      for (const h of d.history) if (h.customerId === c.id) rows.push({ n: d.id, from: h.droppedOff, to: h.pickedUp, agreed: h.agreedTons, actual: h.actualTons, charge: h.charge || 0, price: h.price });
    }
    rows.sort((a, b) => String(b.from || '').localeCompare(String(a.from || '')));
    return rows.map(r => `<div class="row"><div class="main"><div class="headline"><span>Dumpster ${r.n}${r.current ? ' · out now' : ''}</span>${r.price != null ? `<span class="amount">${money(r.price + r.charge)}</span>` : ''}</div><div class="sub small">${r.from ? fmtDay(r.from) : ''}${r.to ? ' to ' + fmtDay(r.to) : (r.due ? ' · due back ' + fmtDay(r.due) : '')}${r.actual != null && r.agreed != null ? ' · ' + tonsText(r.actual) + ' of ' + tonsText(r.agreed) : ''}${r.charge > 0 ? ' · overweight ' + money(r.charge) : ''}</div></div></div>`).join('');
  }

  function renderCustomerDetail(item, opts) {
    const c = customerById(item.id);
    if (!c) return { nav: navBar({ title: '', left: backBtn() }), body: '' };
    const jobs = sortedJobs().filter(j => j.customerId === c.id).reverse();
    let body = section('',
      (c.phone ? `<div class="field"><label>Phone</label><a class="value filled" href="${esc(telURL(c.phone))}" style="color:var(--ios-blue)">${esc(c.phone)}</a></div>` : `<div class="field"><label>Phone</label><span class="value">—</span></div>`) +
      `<div class="field"><label>Address</label><span class="value ${c.address ? 'filled' : ''}" style="max-width:60%">${esc(c.address || '—')}</span></div>` +
      (c.notes ? `<div class="field"><span>${esc(c.notes)}</span></div>` : '') +
      customerActions(c));
    body += section('', customerSummaryRows(c));
    const rentals = customerRentals(c);
    if (rentals) body += section('Dumpster rentals', rentals);
    body += section('Jobs', (jobs.length ? jobs.map(j => jobRow(j, true, true)).join('') : emptyRow('No jobs yet.')) + (opts && opts.noNewRow ? '' : `<button class="row tap link-row" data-action="new-job-for" data-id="${c.id}">${ICON.plus.replace('<svg', '<svg style="width:20px;height:20px"')} New job for ${esc(c.name)}</button>`));
    return { nav: navBar({ title: c.name, small: true, left: backBtn(), right: `<button class="pill blue" data-action="edit-customer" data-id="${c.id}">Edit</button>` }), body };
  }

  function renderDumpsterDetail(item) {
    const d = dumpsterById(item.id);
    if (!d) return { nav: navBar({ title: '', left: backBtn() }), body: '' };
    if (!ui.draft || ui.draft.kind !== 'dumpster' || ui.draft.id !== d.id) ui.draft = { kind: 'dumpster', id: d.id, data: { actual: '', dropCustomerId: null, dropLocation: '', dropDate: todayISO(), dueDate: offsetISO(7), dropPrice: '', dropTons: '', dropNotes: '' } };
    const dr = ui.draft.data;
    const s = dumpsterStatus(d);
    const rate = state.settings.rate;
    let body = section('', `<div class="field"><label>Status</label><span class="value filled ${s.cls}">${s.text}</span></div>` + fieldText('Size or nickname', 'label', d.label, 'Size or nickname, e.g. 15 yard') + fieldText('Dumpster note', 'condition', d.condition || '', 'Damage, or anything to remember'));
    if (d.isOut) {
      const c = customerById(d.customerId);
      body += section('Current rental',
        `<div class="field"><label>Customer</label><span class="value filled">${esc(c ? c.name : '—')}</span></div>` +
        `<div class="field"><label>Location</label><span class="value filled" style="max-width:60%">${esc(d.location || '—')}</span></div>` +
        (d.droppedOff ? `<div class="field"><label>Dropped off</label><span class="value filled">${fmtDay(d.droppedOff)}</span></div>` : '') +
        fieldText('Due back', 'dueBack', d.dueBack, '', 'date') +
        `<div class="field"><label>Price</label><span class="value filled">${d.price != null ? money(d.price) : '—'}</span></div>` +
        `<div class="field"><label>Agreed weight</label><span class="value filled">${d.agreedTons != null ? tonsText(d.agreedTons) : '—'}</span></div>` +
        (d.notes ? `<div class="field"><span>${esc(d.notes)}</span></div>` : ''));
      const actual = parseMoney(dr.actual);
      let pickup = fieldText('Actual weight in tons', 'actual', dr.actual, 'Actual weight in tons', 'text');
      if (actual != null && d.agreedTons != null) {
        if (actual > d.agreedTons) {
          pickup += `<div class="field"><label>Over by</label><span class="value filled">${tonsText(actual - d.agreedTons)}</span></div>`;
          pickup += `<div class="field"><label>Overweight charge</label><span class="value filled status-orange">${money(overweightCharge(d.agreedTons, actual, rate))}</span></div>`;
        } else pickup += `<div class="field"><span class="empty">Within the agreed weight. No extra charge.</span></div>`;
      }
      pickup += `<button class="row tap link-row" data-action="pickup">Mark picked up</button>`;
      body += section('Pickup', pickup, `Rate: ${money(rate)} per ton over the agreed weight. Change it in Settings.`);
    } else {
      const c = customerById(dr.dropCustomerId);
      body += section('Drop off',
        `<div class="field"><label>Customer</label><button type="button" class="pill blue" style="min-height:36px;padding:0 12px" data-action="pick-drop-customer">${esc(c ? c.name : 'Choose')}</button></div>` +
        fieldText('Location', 'dropLocation', dr.dropLocation, 'Location') +
        fieldText('Drop-off', 'dropDate', dr.dropDate, '', 'date') +
        fieldText('Due back', 'dueDate', dr.dueDate, '', 'date') +
        fieldText('Price', 'dropPrice', dr.dropPrice, 'Price in dollars') +
        fieldText('Agreed weight', 'dropTons', dr.dropTons, 'Agreed weight in tons') +
        fieldText('Notes', 'dropNotes', dr.dropNotes, 'Notes') +
        `<button class="row tap link-row" data-action="dropoff" ${dr.dropCustomerId ? '' : 'disabled style="opacity:.4"'}>Mark dropped off</button>`);
    }
    const month = monthRentals(d);
    if (month.n) body += section('', `<div class="field"><label>This month</label><span class="value filled">${month.n} ${month.n === 1 ? 'rental' : 'rentals'} · ${money(month.sum)}</span></div>`);
    if (d.history.length) {
      body += section('Past rentals', [...d.history].reverse().map(h => {
        const c = customerById(h.customerId);
        const parts = [];
        if (h.price != null) parts.push(money(h.price));
        if (h.agreedTons != null && h.actualTons != null) parts.push(`${tonsText(h.actualTons)} of ${tonsText(h.agreedTons)}`);
        if (h.charge > 0) parts.push('overweight ' + money(h.charge));
        return `<div class="row"><div class="main"><div class="headline">${esc(c ? c.name : 'No customer')}</div><div class="sub">${fmtDay(h.droppedOff)} to ${fmtDay(h.pickedUp)}</div><div class="sub small">${esc(parts.join(' · ') || 'No details')}</div></div></div>`;
      }).join(''));
    }
    return { nav: navBar({ title: `Dumpster ${d.id}`, small: true, left: backBtn() }), body };
  }

  // Can this page reach Anthropic (or the relay) at all? Checked once, when Settings
  // opens, with a throwaway value in place of a key: any answer, even a refusal, means
  // the connection is open; no answer at all means the browser blocks it.
  let reach = '';
  function probeConnection() {
    if (reach) return;
    reach = 'checking';
    const req = RELAY_URL
      ? fetch(RELAY_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })
      : fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': 'connection-check', 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: '{}' });
    req.then(() => { reach = 'open'; }, () => { reach = 'blocked'; }).then(() => { if ((ui.sheet && ui.sheet.type === 'settings') || ui.stack.some(x => x.type === 'settings')) render(); });
  }
  function settingsKeySections() {
    probeConnection();
    const reachRow = `<div class="field"><label>Connection to ${RELAY_URL ? 'the relay' : 'Anthropic'}</label><span class="value filled ${reach === 'blocked' ? 'status-red' : ''}">${reach === 'open' ? 'Open' : reach === 'blocked' ? 'Blocked by this browser' : 'Checking'}</span></div>`;
    if (apiKey) {
      return section('Assistant', `<div class="field"><label>API key</label><span class="value filled">${esc(keyHint())}</span></div>` + reachRow,
        'This key is saved in this browser and sent only to Anthropic. In this preview the Assistant is typed, not spoken.') +
        section('', `<button class="row tap link-row destructive" data-action="remove-key">Remove key</button>`);
    }
    if (RELAY_URL) {
      return section('Assistant', `<div class="field"><label>Claude</label><span class="value filled">Through the demo relay</span></div>` + reachRow,
        'Everyone who opens this link gets the Assistant. In this preview it is typed, not spoken.');
    }
    return section('Assistant',
      `<div class="field"><label for="f-apikey">API key</label><input id="f-apikey" type="text" style="-webkit-text-security:disc" data-field="apikey" value="${esc(ui.keyDraft || '')}" placeholder="Anthropic API key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div><button class="row tap link-row" data-action="save-key" ${(ui.keyDraft || '').trim() ? '' : 'disabled style="opacity:.4"'}>Save key</button>` + reachRow,
      'Paste the key from console.anthropic.com and ' + (mode === 'mac' ? 'click' : 'tap') + ' Save key. It stays in this browser and is sent only to Anthropic. In this preview the Assistant is typed, not spoken.');
  }

  function renderSettings() {
    const body =
      settingsKeySections() +
      section('Dumpsters', fieldText('Rate per ton over', 'rate', String(state.settings.rate), 'Dollars'), 'Charged for each ton over the agreed weight at pickup. Partial tons are charged in proportion.') +
      settingsCalendarSections();
    return { nav: navBar({ title: 'Settings', small: true, left: backBtn() }), body };
  }

  // Settings › Calendar (docs/calendar-tab.md). The demo behaves like a phone where the Google account is added
  // and calendar access was allowed.
  function settingsCalendarSections() {
    const cs = calSettings(); const hidden = cs.hidden || [];
    const opts = [['', 'None'], ...DEVICE_CALS.filter(c => c.writable).map(c => [c.id, `${c.name} · ${c.account}`])];
    const picker = `<div class="field"><label for="f-caljobs">Calendar for Jobs</label><select id="f-caljobs" data-field="caljobs">${opts.map(([v, l]) => `<option value="${v}" ${v === (cs.jobs || '') ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    const shown = DEVICE_CALS.filter(c => c.id !== cs.jobs).map(c => { const on = !hidden.includes(c.id); return `<div class="field"><label><span class="cal-dot" style="background:${c.color};margin-right:8px;vertical-align:-1px"></span>${esc(c.name)}</label><button type="button" class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${on}" aria-label="Show ${esc(c.name)}" data-action="cal-show" data-cal="${c.id}"></button></div>`; }).join('');
    return section('Calendar', `<div class="field"><label>Calendar Access</label><span class="value filled">Full access</span></div>` + picker, 'Jobs are added to the calendar for jobs when saved. Changes made in Google Calendar do not change jobs in Ace.') +
      section('Show Calendars', shown);
  }

  // ---------- Sheets ----------
  function sheetWrap(nav, body) { return `<div class="sheet"><div class="panel"><div class="nav">${nav}</div><div class="content sheet-content">${body}</div></div></div>`; }
  function renderSheet(sheet) {
    if (sheet.type === 'newJob') return sheetWrap(navBar({ title: 'New Job', small: true, left: `<button class="pill" data-action="close-sheet">Cancel</button>`, right: `<button class="pill bold" data-action="save-new-job" ${sheet.data.customerId ? '' : 'disabled style="opacity:.4"'}>Save</button>` }), jobForm(sheet.data, true));
    if (sheet.type === 'quoteForm') return sheetWrap(navBar({ title: 'New Quote', small: true, left: `<button class="pill" data-action="close-sheet">Cancel</button>`, right: `<button class="pill bold" data-action="save-new-quote" ${sheet.data.customerId ? '' : 'disabled style="opacity:.4"'}>Save</button>` }), quoteForm(sheet.data));
    if (sheet.type === 'customerForm') {
      const c = sheet.data;
      const body = section('', fieldText('Name', 'name', c.name, 'Name') + fieldText('Phone', 'phone', c.phone, 'Phone', 'tel') + fieldText('Address', 'address', c.address, 'Address')) + section('Notes', fieldNotes('cnotes', c.notes)) + (sheet.id ? section('', `<button class="row tap link-row destructive" data-action="delete-customer">Delete customer</button>`) : '');
      return sheetWrap(navBar({ title: sheet.id ? 'Edit Customer' : 'New Customer', small: true, left: `<button class="pill" data-action="close-sheet">Cancel</button>`, right: `<button class="pill bold" data-action="save-customer" ${c.name.trim() ? '' : 'disabled style="opacity:.4"'}>Save</button>` }), body);
    }
    if (sheet.type === 'picker') {
      const q = (sheet.q || '').toLowerCase(); const qd = digits(q);
      const list = [...state.customers].sort((a, b) => a.name.localeCompare(b.name)).filter(c => !q || c.name.toLowerCase().includes(q) || c.address.toLowerCase().includes(q) || (qd && digits(c.phone).includes(qd)));
      const body = `<div class="search">${ICON.search}<input type="search" placeholder="Name, phone or address" value="${esc(sheet.q || '')}" data-action="picker-search"></div>` +

  const PLAN_PROMPT = "You help the office and the crew of Ace Junk Removal, a junk removal, demolition and dumpster rental company in Massachusetts. The input is a spoken note written down by speech recognition, so names, street names and numbers may be misheard. Fix a misheard word only when the correction is certain.\n\nToday is {today} ({zone}). The time is {now}.\n\nThe person speaking is Ashley in the office (booking work, answering the phone, keeping the books) or Alex and the crew in the field (finishing jobs, collecting payment, dropping off and picking up dumpsters). Work out what they want done and return it as a list of actions. One note can hold several actions: \"Johnson's done, paid cash, and she wants a dumpster next Friday\" is an update to her job and a new job.\n\nThe records sent with the note start with the customer directory: every customer on file, with phone and address. Then come the dumpsters, the jobs from two weeks ago to two months ahead, the open quotes, the crew with their hours this week and last week, and fuller lines for the customers the note seems to be about. Each record has a reference like C4, J12, Q2, D3 or W2. When an action is about a record, put its reference in \"ref\". Look customers up in the directory by name, phone, street or town. Speech recognition often mishears house numbers and names, so a close match on the same street or a similar name is probably the one meant: use it and say so, rather than saying nobody was found. When the note names someone who is in neither the directory nor the records, leave \"ref\" empty and fill in the name, phone and address as said; that is a new customer.\n\nActions:\n- new_job: book new work. Fill customerName, phone and address as said, jobType, date, time, endTime (when it will end, when an end or a length was said), price, paymentType, paid and note. A dumpster delivery, pickup or swap booked for later is a new_job with that jobType. A visit to look at work and give a price is jobType \"Quote visit\": \"schedule a quote\", \"quote it Tuesday at 3\", \"go price the basement\", \"come out and give a price\". A call-back or reminder is jobType \"Other\" on that day, with the reason in note.\n- update_job: change a job that exists. done \"yes\" when it is finished, \"no\" when it is not finished after all. paid \"yes\" when it was paid, with paymentType and, if an amount was said, price; paid \"no\" when payment did not happen or a check bounced. newDate and newTime when it moved. endTime when its end changed or a new end was said. price when the price changed. jobType when the kind of work changed. note for anything to write down: a no-show, a dump fee, an extra item, a promise to pay later. Being paid on site means the work is done. Fill only what changes.\n- cancel_job: the job is off. The app asks before removing it.\n- new_customer: add a customer without booking work: customerName, phone, address, note.\n- update_customer: a customer's details changed or there is something to remember about them: newName, newPhone, newAddress, note (gate codes, dogs, how they pay, who to ask for).\n- contact_customer: call, text or get directions. contact is \"call\", \"text\" or \"directions\"; for a text, message is the text to send. ref can be the customer or the job.\n- dumpster_dropoff: a dumpster has just been dropped off or delivered: dumpsterNumber, customerName, address, dueBack, price, agreedTons, note.\n- dumpster_pickup: a dumpster has just been picked up, collected or weighed: dumpsterNumber (or the customer or address it was at) and actualTons.\n- dumpster_swap: a full dumpster was taken away and an empty one left in its place: dumpsterNumber is the one taken away, actualTons its weight, otherDumpsterNumber the one left, and dueBack, price and agreedTons for the new rental when said.\n- update_rental: change a dumpster that is out: dueBack (kept longer or picked up sooner), price, agreedTons, newAddress (moved on the property or to another place), note.\n- dumpster_note: something about a dumpster itself, such as damage or that it should not go out: dumpsterNumber and note.\n- new_quote: a price was given that the customer has not accepted yet: customerName, phone and address as said, jobType, price, note (what was quoted, in a few words) and followUp (the day to call them back, when said).\n- update_quote: an open quote changed. quoteStatus \"approved\" when the customer said yes or approved it, with date, time and endTime for the work when said; \"declined\" when they said no or went elsewhere. price when it changed. followUp when a call-back day was said. note for anything to write down. A call-back about an open quote is an update_quote with followUp, not a new_job. When a price is given and accepted in the same note and no open quote matches, book a new_job instead. A quote with a day or time to go and see the work is a visit, not a new_quote: book a new_job with jobType \"Quote visit\" on that day.\n- log_hours: hours a crew member worked on a day: workerName as said, ref when they are on the crew list (W2), hours as digits (\"eight and a half\" is 8.5; 0 when they were off or out sick) and date (today when no day is said). One action per person per day: \"Joey worked 8 today and Chris 6\" is two. A first name alone is enough when it matches one person on the crew. Salaried crew count as working their work days without being logged: log them only when they were off (hours 0) or worked another day (the hours said, or 8).\n\nWhen the note asks a question, for example \"which dumpsters are due back Friday\", \"what do we have tomorrow\", \"how much does Pereira owe\", \"what's Johnson's address\", \"who lives at 63 Locust Street in Taunton\", \"is a dumpster free Friday\", \"which quotes need a call back\" or \"how many hours did Joey work this week\", answer it in \"reply\" from the records in one or two plain sentences, and return actions only if something should also be done. If the records do not hold the answer, say so. Name customers and jobs in \"reply\" by name and day, never by their reference (C4, J12): references are for the app.\n\nWhen the note asks for something none of the actions can do, such as sending an invoice, changing a setting, undoing a change or deleting a customer, say in \"reply\" what was understood and the nearest thing that can be done, and return no actions.\n\nLeave \"reply\" empty when the actions cover the note.\n\nRules for fields:\n- Fill only what the note says. Use an empty string for anything not said. Never invent a name, number, price or address.\n- Dates as YYYY-MM-DD, worked out from today: \"tomorrow\", \"Friday\" (the next Friday, or today if today is Friday), \"next week\". Times as HH:MM in 24-hour time. \"This morning\", \"just now\", \"just finished\" and \"on site\" mean today.\n- Money as digits: \"three hundred\" is 300. Weights in tons as digits: \"two point eight\" is 2.8. An end time is worked out from what was said: \"till noon\" is 12:00; \"about three hours\" from a 9:00 start is 12:00. With no end or length said, leave endTime empty; never guess one. A day said without a time (\"tomorrow\", \"Friday\") still fills date; leave time empty and do not ask about it. Speech recognition sometimes writes a time as money: \"tomorrow at $10\" is 10:00, not a price.\n- jobType from the work described; nobody says \"junk removal\" out loud. Junk removal: clearing, emptying or cleaning out a garage, basement, attic, shed, house, estate or office, or hauling away furniture, appliances, debris or a hot tub. Demolition: tearing down or taking out a shed, deck, pool, fence, wall, kitchen, bathroom or flooring, or any mention of \"demo\". Dumpster drop-off, Dumpster pickup and Dumpster swap: booking those for a later day. Quote visit: going to look and give a price; the office calls this a quote, never an estimate. Other: anything else. Leave it empty only when nothing says what the work is.\n- paymentType is cash, chec   // Calls the Anthropic Messages API from the browser with the saved key,
  // mirroring ClaudeClient.swift: structured output, no temperature, no tool_choice.
  async function claudeFill(note, model, sheet, records) {
    const controller = new AbortController();
    if (sheet) sheet.abort = controller;
    const timer = setTimeout(() => controller.abort(), 90000);
    let res, json = null;
    // A key the browser cannot put in a header must not be blamed on the connection.
    const relay = useRelay();
    if (!relay) { try { new Headers({ 'x-api-key': apiKey }); } catch (e) { throw { code: 'bad_key' }; } }
    const body = JSON.stringify({
      model,
      max_tokens: 16000,
      system: planSystem(),
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: PLAN_SCHEMA } },
      messages: [{ role: 'user', content: `Spoken note:\n${note}\n\nRecords:\n${records}` }],
    });
    try {
      res = await fetch(relay ? RELAY_URL : 'https://api.anthropic.com/v1/messages', {
        method: 'POST',
        signal: controller.signal,
        headers: relay ? { 'content-type': 'application/json' } : {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body,
      });
      try { json = await res.json(); } catch (e) { if (e && e.name === 'AbortError') throw e; json = null; }
    } catch (e) {
      throw { code: e && e.name === 'AbortError' ? 'timeout' : 'network' };
    } finally { clearTimeout(timer); if (sheet && sheet.abort === controller) sheet.abort = null; }
    if (!res.ok) throw { code: 'http', status: res.status, message: (json && json.error && json.error.message) || '' };
    if (!json) throw { code: 'invalid_json' };
    if (json.stop_reason === 'refusal') throw { code: 'refused', message: (json.stop_details && json.stop_details.explanation) || '' };
    if (json.stop_reason === 'max_tokens') throw { code: 'cut_off' };
    const block = Array.isArray(json.content) ? json.content.find(b => b && b.type === 'text') : null;
    if (!block || typeof block.text !== 'string') throw { code: 'invalid_json' };
    try { return JSON.parse(block.text); } catch (e) { throw { code: 'invalid_json' }; }
  }

  function assistantErrorText(e) {
    const code = (e && e.code) || '';
    const status = e && e.status;
    if (code === 'cancelled') return 'Stopped.';
    if (code === 'rate_limited' || (code === 'http' && status === 429)) return 'Claude is busy right now. Try again in a minute.';
    if (code === 'http' && status === 401) return 'The API key was not accepted. Remove it in Settings and paste it again.';
    if (code === 'http' && status === 403) return 'This API key does not have permission for this request. Check the key at console.anthropic.com.';
    if (code === 'http' && status === 404) return 'This API key cannot use the Claude model this preview needs. Check the key at console.anthropic.com.';
    if (code === 'http' && status >= 500) return 'The Anthropic service is having trouble. Try again in a minute.';
    if (code === 'http') { const m = String(e.message || ''); return ('The Anthropic service answered with error ' + status + '. ' + (m.length > 200 ? m.slice(0, 200) + '\u2026' : m)).trim(); }
    if (code === 'bad_key') return 'The saved API key has stray characters. Remove it in Settings and paste it again.';
    if (code === 'network') return 'Claude could not be reached. The browser blocked the connection or the internet is down. To use the built-in fill-in instead, remove the key in Settings.';
    if (code === 'timeout') return 'Claude took too long to answer. Try again.';
    if (code === 'refused') return ('Claude declined this request. ' + String(e.message || '')).trim();
    if (code === 'cut_off') return 'The answer was cut off before it finished. Try again.';
    if (code === 'invalid_json') return 'The answer could not be read. Try again.';
    return 'Something went wrong. Try again.';
  }

  function renderAssistant(sheet) {
    const titles = { review: 'New Job', update: 'Update Job', pickup: 'Dumpster Pickup', dropoff: 'Dumpster Drop-off', choose: 'Assistant', nojob: 'Assistant', g: sheet.g ? (sheet.g.title || G_TITLES[sheet.g.type]) : 'Assistant' };
    const rights = { review: `<button class="pill bold" data-action="assistant-save">Save</button>`, update: `<button class="pill bold" data-action="assistant-update-save">Save</button>`, pickup: `<button class="pill bold" data-action="assistant-pickup-save">Mark Picked Up</button>`, dropoff: `<button class="pill bold" data-action="assistant-dropoff-save">Mark Dropped Off</button>`, g: sheet.g ? `<button class="pill bold ${sheet.g.type === 'cancel_job' ? 'red' : ''}" data-action="assistant-g-save">${sheet.g.button || G_BUTTONS[sheet.g.type]}</button>` : '' };

        (sheet.phase === 'thinking' ? `<div class="row"><div class="spinner"></div><span class="empty">Working it out.</span></div>` :

          `<button class="row tap link-row" data-action="assistant-fill">${ICON.mic.replace('<svg', '<svg style="width:20px;height:20px"')} Fill in the form</button>`),

        (r.hasTime ? fieldFlag(fieldText('Time', 'r-time', r.time, '', 'time'), 'time') + endFields('r-', r.hasEnd, r.end, r.time) + flagged('endTime') + overlapNote(overlapsFor(r.date, r.time, r.hasEnd ? r.end : '', null)) : flagged('time')));

      body += section(sheet.chooseTitle || 'Which one?', chooseRows(sheet)) + stepFooter(sheet);
    } else if (sheet.phase === 'nojob') {
      body += section('', `<div class="answer">${esc(sheet.missingText || 'Nothing was found.')}</div>`) + (sheet.allowAsJob ? section('', `<button class="row tap link-row" data-action="assistant-as-job">Start a new job instead</button>`) : '') + stepFooter(sheet);

      body += renderPickupPhase(sheet);
    } else if (sheet.phase === 'dropoff') {
      body += renderDropoffPhase(sheet);
    } else if (sheet.phase === 'g') {
      body += renderGenericPhase(sheet);

    const knownNames = new Set(s.customers.map(c => (c.name + '|' + c.address).toLowerCase()));
    const id = prefix => { s.nextId = (s.nextId || 100) + 1; return prefix + s.nextId; };
    let added = 0, skipped = 0;
    for (const row of file.rows) {
      const d = digits(row.phone); const key = (row.name + '|' + row.address).toLowerCase();
      if (d ? knownPhones.has(d) : knownNames.has(key)) { skipped++; continue; }
      const c = { id: id('c'), name: row.name, phone: row.phone, address: row.address, notes: row.notes, imported: true };
      s.customers.push(c); if (d) knownPhones.add(d); knownNames.add(key); added++;

    }
    s.imported = true;

    if (added && s.dumpsters.every(d => !d.history.length)) {
      const r = rng(7); const imported = s.customers.filter(c => c.imported);
      const rate = (s.settings && s.settings.rate) || 125;

        const yard15 = /15/.test(d.label || '');
        let end = d.isOut && d.droppedOff ? Math.round((parseISO(d.droppedOff) - parseISO(todayISO())) / 86400000) - 2 - Math.floor(r() * 6) : -2 - Math.floor(r() * 7);

        for (let k = 0; k < count; k++) {

          const c = imported[Math.floor(r() * imported.length)];
          const agreed = yard15 ? 2 : 3; const over = r() < 0.3 ? Math.round((0.2 + r() * 1.0) * 10) / 10 : 0; const actual = Math.round((agreed + over) * 10) / 10;
          d.history.push({ customerId: c.id, location: c.address, droppedOff: offsetISO(from), pickedUp: offsetISO(end), price: yard15 ? 450 : 525, agreedTons: agreed, actualTons: actual, charge: overweightCharge(agreed, actual, rate) });
