# Runs the app in the iPhone Simulator on a GitHub-hosted Mac and saves a
# screenshot of each screen (light mode, sample data loaded) into
# docs/screenshots/. Started by hand only; it costs about 5 Mac minutes
# (50 of the monthly allowance). It shows how screens look; it cannot run the
# speech model properly or call Claude (no API key on the cloud Mac).
name: Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Simulator screenshots (Xcode 27.1)
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode 27.1 and an iPhone simulator
        id: sim
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for rt, xs in d.items() if 'iOS' in rt for x in xs if x['name'].startswith('iPhone')]
          pm = [x for x in phones if 'Pro Max' in x['name']]
          pick = (pm or phones)[-1]
          print(pick['udid'])
          print(pick['name'], file=sys.stderr)
          ")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Build for the Simulator
        run: |
          xcodebuild build -project Ace.xcodeproj -scheme Ace -derivedDataPath DerivedData \
            -destination "id=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > sim-build.log 2>&1 || { grep -E "error:|BUILD" sim-build.log; exit 1; }
          grep -E "BUILD (SUCCEEDED|FAILED)" sim-build.log

      - name: Install, open each screen, photograph it
        run: |
          DEVICE="${{ steps.sim.outputs.device }}"
          APP=$(find DerivedData/Build/Products -name "Ace.app" -path "*iphonesimulator*" | head -1)
          BUNDLE=com.acejunkremoval.app
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          xcrun simctl install "$DEVICE" "$APP"

          shot() {
            name="$1"; shift
            xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$DEVICE" "$BUNDLE" -sampledata "$@"
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "docs/screenshots/$name.png"
          }

          TRANSCRIPT="Mrs. Johnson on Elm Street in Taunton, junk removal Friday morning, three hundred cash, she said she'd pay when we get there, number is 508 555 0147"

          # Light mode only (Kyle's preference, 2026-10-18). Dark mode and the
          # text-size pass happen on the real phone in step 9.
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl ui "$DEVICE" content_size medium || true
          shot "1-today" -open today
          shot "2-jobs" -open jobs
          shot "3-customers" -open customers
          shot "4-dumpsters" -open dumpsters
          shot "5-assistant" -open assistant
          shot "6-settings" -open settings
          shot "7-speech-test" -open speech
          shot "8-claude-test" -open claude -debug.transcript "$TRANSCRIPT"
          ls -la docs/screenshots

      - name: Build the Mac app and photograph its screens
        continue-on-error: true
        run: |
          xcodebuild build -project Ace.xcodeproj -scheme Ace -derivedDataPath DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > mac-build.log 2>&1 || { grep -E "error:|BUILD" mac-build.log; exit 1; }
          APP=$(find DerivedData/Build/Products -name "Ace.app" -path "*Debug/Ace.app" -not -path "*iphone*" | head -1)
          echo "Mac app: $APP"
          ls -la "$APP/Contents/MacOS"
          defaults write com.acejunkremoval.app AppleInterfaceStyle -string Light 2>/dev/null || true

          macshot() {
            name="$1"; shift
            OUT="$PWD/docs/screenshots/$name.png"
            rm -f "$OUT"
            # The app draws its own windows into the file (see WindowSnapshot.swift)
            # and quits; the cloud Mac allows no screen recording, so a normal
            # screenshot would come out black.
            open -n "$APP" --args -sampledata "$@" -screenshot "$OUT" > "mac-launch-$name.log" 2>&1 || true
            for i in $(seq 1 30); do
              [ -s "$OUT" ] && break
              sleep 1
            done
            sleep 1
            pkill -x Ace 2>/dev/null || true
            sleep 2
            if [ -s "$OUT" ]; then echo "captured $name"; else echo "NO IMAGE for $name"; cat "mac-launch-$name.log" || true; fi
            # The app's own account of what it saw (see WindowSnapshot.swift).
            if [ -f "$OUT.log" ]; then echo "---- app log ($name) ----"; cat "$OUT.log"; rm -f "$OUT.log"; else echo "(the app wrote no log: it did not start, or did not see -screenshot)"; fi
            [ -s "$OUT" ] || log show --last 90s --predicate 'process == "Ace" OR (process == "ReportCrash" AND eventMessage CONTAINS "Ace")' --style compact 2>/dev/null | tail -25 || true
          }
          macshot "mac-1-today" -open today
          macshot "mac-2-jobs" -open jobs
          macshot "mac-3-customers" -open customers
          macshot "mac-4-dumpsters" -open dumpsters
          macshot "mac-5-assistant" -open assistant
          ls -la docs/screenshots

      - name: Save the screenshots into the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          git commit -m "Simulator and Mac screenshots (automated)" || { echo "nothing new"; exit 0; }
          # Other commits may have landed while this ran; put ours on top of them.
          git pull --rebase origin main
          git push origin HEAD:main
